services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ferrel
      POSTGRES_PASSWORD: ferrel
      POSTGRES_DB: ferrel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ferrel
      MINIO_ROOT_PASSWORD: ferrelsecret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
