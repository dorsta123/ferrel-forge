name: ferrel-forge

# Ports bind to 127.0.0.1 only: these dev credentials are public in the repo,
# so nothing here may be reachable from other machines on the network.
# Image versions are pinned so a fresh pull can't change them underneath us.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ferrel
      POSTGRES_PASSWORD: ferrel
      POSTGRES_DB: ferrel
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7.4.11
    ports: ["127.0.0.1:6379:6379"]

  # S3-compatible object storage. MinIO no longer publishes free images, so RustFS stands in.
  rustfs:
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: ferrel
      RUSTFS_SECRET_KEY: ferrelsecret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [s3data:/data]

volumes:
  pgdata:
  s3data:
