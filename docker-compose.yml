name: ferrel-forge

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ferrel
      POSTGRES_PASSWORD: ferrel
      POSTGRES_DB: ferrel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # S3-compatible object storage. MinIO no longer publishes free images, so RustFS stands in.
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ferrel
      RUSTFS_SECRET_KEY: ferrelsecret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]

volumes:
  pgdata:
  s3data:
