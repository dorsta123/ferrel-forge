name: Set up ferrel-forge
description: Install dependencies and write .env. Services are started separately (./.github/actions/services) so checks that don't need them run first.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The pinned FFmpeg (packages/audio): cached between runs, keyed on the pinned
    # release and fingerprints, so it's downloaded once per change, not every run.
    - name: Cache FFmpeg
      uses: actions/cache@v4
      with:
        path: .cache/ffmpeg
        key: ffmpeg-${{ runner.os }}-${{ hashFiles('packages/audio/src/ffmpeg-release.ts') }}

    - name: Fetch and verify FFmpeg (skips when the cached copy verifies)
      shell: bash
      run: pnpm audio:fetch

    - name: Write .env from the example, with a fresh auth secret
      shell: bash
      run: |
        cp .env.example .env
        sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" .env
